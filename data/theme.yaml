# Three fields — short hook, full title, long description.
theme: "High Seas, Deep Seas"
theme_name: "Ashgrove's aquatic adventure"
theme_description: |
  Grab your sea bag and hurry aboard. Climb the rigging to the swaying
  crow's nest and sing a shanty, as we sail the high seas. Dive into
  the deep to see what's below and make friends with starfish, dolphins,
  and glow worms.

  From the calm of the lagoon to the wild of the open ocean, each unit
  charts its own course through ten days of friendship, songs, badges,
  and adventure. There's a place for every camper — whether she's a
  first-time sailor or a returning shipmate.

  Ashgrove has been an entirely volunteer-run Girl Scout day camp at
  Camp Crowell since 1976. We can't wait to welcome your crew.

