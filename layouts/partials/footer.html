<footer class="site">
  <div class="wrap">
    <div class="fgrid">
      <div>
        <div class="brand-name" style="font-size: 1.2em;">{{ .Site.Title }}</div>
        <p class="brand-blurb">{{ .Site.Params.description }}</p>
      </div>
      {{ range .Site.Params.footer.cols }}
        <nav class="fcol" aria-label="{{ .heading }}">
          <h4>{{ .heading }}</h4>
          <ul>
            {{ range .links }}
              <li><a href="{{ .url | safeURL }}">{{ .label }}</a></li>
            {{ end }}
          </ul>
        </nav>
      {{ end }}
    </div>
  </div>
</footer>
